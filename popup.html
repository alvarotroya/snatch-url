<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snatch URL</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="pop-head">
      <h1>Snatch URL</h1>
      <span class="grow"></span>
      <button id="settings-btn" class="btn btn-sm" aria-label="Open the settings page: host groups"
              title="Settings: host groups">⚙</button>
      <button id="oneline-btn" class="btn btn-sm" aria-pressed="false"
              title="Collapse the URL to a single line that scrolls sideways">one line</button>
      <button id="decoded-btn" class="btn btn-sm" aria-pressed="false"
              title="Show every part decoded; edits still write proper encoding">decoded</button>
    </header>

    <!-- The second address bar: the draft URL, one button per part. -->
    <div class="bar">
      <span class="bar-lock" aria-hidden="true">🔗</span>
      <div id="url-line" role="group" aria-label="URL of this tab, one button per part"></div>
      <div class="bar-tools">
        <button id="copy-url-btn" class="btn btn-sm" aria-label="Copy the whole URL">⎘ URL</button>
      </div>
    </div>

    <!-- One cell per section; each opens the drawer under the bar. -->
    <div id="strip" class="strip">
      <button class="cell" data-section="origin" data-fk="cell:origin" aria-expanded="false" aria-controls="drawer">
        <span class="nm">host</span><span class="ct" id="cell-origin"></span><span class="cv" aria-hidden="true">▾</span>
      </button>
      <!-- Shown only when the host is in one of the owner's host groups (settings). -->
      <select id="host-switch" class="host-switch hidden" data-fk="host-switch" aria-label="Switch host"></select>
      <button class="cell" data-section="path" data-fk="cell:path" aria-expanded="false" aria-controls="drawer">
        <span class="nm">path</span><span class="ct" id="cell-path"></span><span class="cv" aria-hidden="true">▾</span>
      </button>
      <button class="cell" data-section="query" data-fk="cell:query" aria-expanded="false" aria-controls="drawer">
        <span class="nm">query</span><span class="ct" id="cell-query"></span><span class="cv" aria-hidden="true">▾</span>
      </button>
      <button class="cell" data-section="hash" data-fk="cell:hash" aria-expanded="false" aria-controls="drawer">
        <span class="nm">#</span><span class="ct" id="cell-hash"></span><span class="cv" aria-hidden="true">▾</span>
      </button>
      <span class="grow"></span>
      <span class="tools">
        <button id="clean-btn" class="btn btn-sm" title="Strip utm_* and other tracking parameters">⚡ Clean</button>
        <button id="add-btn" class="btn btn-sm" title="Add a query parameter">+ param</button>
      </span>
    </div>

    <div id="drawer" class="drawer hidden"></div>

    <div class="keys" aria-hidden="true">
      <span><kbd>click a part</kbd> type over it</span>
      <span><kbd>click a section</kbd> open its drawer</span>
      <span><kbd>← →</kbd> part to part</span>
      <span><kbd>⌫</kbd> delete</span>
      <span><kbd>esc</kbd> close</span>
      <span><kbd>ctrl ↵</kbd> apply</span>
    </div>

    <!-- Nothing is sent to the tab until one of these is pressed (F3). -->
    <div id="status-bar" class="status-bar">
      <span id="change-summary" class="change-summary" role="status"></span>
      <button id="revert-btn" class="btn btn-sm" aria-label="Discard all unapplied changes" disabled>Revert</button>
      <button id="apply-new-btn" class="btn btn-sm" aria-label="Apply changes in a new tab" disabled>New tab</button>
      <button id="apply-btn" class="btn btn-sm btn-primary" aria-label="Apply changes to this tab" disabled>Apply</button>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
