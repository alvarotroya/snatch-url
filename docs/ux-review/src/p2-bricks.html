<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snatch URL · B · Bricks</title>
<link rel="stylesheet" href="proto.css">
<style>
/* --- B: the URL is a handful of objects ------------------------------ */

#canvas {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 10px 12px;
}

.row {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--surface0);
}
.row:last-child { border-bottom: none; }

.row-glyph {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--surface2);
  width: 14px;
  text-align: center;
  flex-shrink: 0;
  padding-top: 4px;
  cursor: pointer;
  user-select: none;
}
.row-glyph:hover { color: var(--mauve); }

.bricks {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  flex: 1;
  min-width: 0;
}

.brick {
  display: inline-flex;
  align-items: center;
  gap: 0;
  max-width: 100%;
  background: var(--surface0);
  border: 1px solid var(--surface1);
  border-radius: 6px;
  padding: 3px 7px;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.35;
  cursor: grab;
  user-select: none;
  outline: none;
  position: relative;
}
.brick:hover { border-color: var(--surface2); background: #363a50; }
.brick.sel { border-color: var(--mauve); background: #3b3355; box-shadow: 0 0 0 1px var(--mauve); }
.brick:focus-visible { outline: 2px solid var(--lavender); outline-offset: 1px; }
.brick.dragging { opacity: 0.4; }
.brick.drop-before::before, .brick.drop-after::after {
  content: '';
  position: absolute;
  top: -2px;
  bottom: -2px;
  width: 2px;
  background: var(--mauve);
  border-radius: 2px;
}
.brick.drop-before::before { left: -4px; }
.brick.drop-after::after { right: -4px; }

.brick.changed { border-color: var(--staged); box-shadow: inset 0 -2px 0 var(--staged); }
.brick.moved { border-style: dashed; border-color: var(--staged); }

.brick .bk { color: var(--blue); }
.brick .bv { color: var(--green); }
.brick .bs { color: var(--peach); }
.brick .bh { color: var(--teal); }
.brick .bo { color: var(--mauve); }
.brick .bsep { color: var(--surface2); padding: 0 2px; }
.brick .badge { margin-left: 5px; }
.brick .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 190px; display: inline-block; vertical-align: bottom; }

.brick.ghost {
  background: transparent;
  border-style: dashed;
  border-color: var(--surface1);
  color: var(--muted);
  text-decoration: line-through;
  cursor: pointer;
}
.brick.ghost .bk, .brick.ghost .bv, .brick.ghost .bs { color: var(--muted); }

.brick.fixed { cursor: default; background: transparent; border-color: transparent; color: var(--surface2); padding-left: 0; }

.brick input {
  font-family: var(--mono);
  font-size: 12.5px;
  background: var(--crust);
  border: none;
  outline: none;
  color: var(--text);
  padding: 0 2px;
  border-radius: 3px;
  min-width: 30px;
}

.add-brick {
  border-style: dashed;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}
.add-brick:hover { color: var(--mauve); border-color: var(--mauve); }

/* --- split value: sub-bricks inside a brick --- */
.brick.split .bv { display: inline-flex; gap: 3px; }
.sub {
  background: #232436;
  border: 1px solid var(--surface1);
  border-radius: 4px;
  padding: 0 4px;
  color: var(--green);
}
.sub.gone { text-decoration: line-through; color: var(--surface2); }

/* --- selection toolbar --- */
#toolbar {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 10px;
  background: var(--mantle);
  border-bottom: 1px solid var(--surface0);
  flex-shrink: 0;
  overflow-x: auto;
}
#toolbar .what {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
}
#toolbar .what b { color: var(--text); }
#toolbar.idle .what { color: var(--surface2); }

/* --- the URL this adds up to --- */
#preview {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 7px 10px;
  background: var(--crust);
  border-top: 1px solid var(--surface0);
  flex-shrink: 0;
}
.pv-label {
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--surface2);
  padding-top: 2px;
  flex-shrink: 0;
  width: 46px;
}
.pv-url {
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  overflow-wrap: anywhere;
  max-height: 46px;
  overflow-y: auto;
  user-select: text;
}
#preview.dirty .pv-url { color: var(--staged); }

/* --- nested tray --- */
#tray {
  border-top: 2px solid var(--mauve);
  background: var(--mantle);
  padding: 8px 10px 10px;
  flex-shrink: 0;
  max-height: 210px;
  overflow-y: auto;
}
.tray-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}
.tray-head b { color: var(--teal); font-family: var(--mono); }
.tray-head .spacer { flex: 1; }
</style>
</head>
<body>
<div id="app">

  <div class="demo-bar">
    <span class="demo-tag">demo url</span>
    <button data-sample="short">short</button>
    <button data-sample="typical" aria-pressed="true">typical</button>
    <button data-sample="monster">monster</button>
    <span class="spacer"></span>
    <span>440 × 600</span>
  </div>

  <header>
    <h1>Snatch URL</h1>
    <span class="variant">B · Bricks</span>
  </header>

  <div id="toolbar" class="idle">
    <span class="what" id="what">Nothing selected</span>
    <button class="btn" data-act="copy" title="Copy the selected parts as they appear in the URL">Copy</button>
    <button class="btn" data-act="copy-plain" title="Copy the selected parts decoded, one per line">Plain</button>
    <button class="btn" data-act="split" title="Pull a delimited value apart">Split</button>
    <button class="btn" data-act="inside" title="Edit a nested URL as its own bricks">Inside</button>
    <button class="btn btn-danger" data-act="del" title="Delete the selected parts">Delete</button>
  </div>

  <div id="canvas"></div>

  <div id="preview">
    <span class="pv-label">resulting url</span>
    <span class="pv-url" id="pv-url"></span>
    <button class="btn" id="copy-url">Copy URL</button>
  </div>

  <div id="tray" class="hidden"></div>

  <div class="keys">
    <span><kbd>click</kbd> pick</span>
    <span><kbd>⇧click</kbd> range</span>
    <span><kbd>⌘click</kbd> add</span>
    <span><kbd>drag</kbd> reorder</span>
    <span><kbd>dbl-click</kbd> type over</span>
    <span><kbd>←→</kbd> walk</span>
    <span><kbd>space</kbd> select</span>
    <span><kbd>⌫</kbd> delete</span>
  </div>

  <div class="status-bar" id="status-bar">
    <span class="change-summary" id="change-summary" role="status">No unapplied changes</span>
    <button class="btn" id="revert-btn" disabled>Revert</button>
    <button class="btn" id="new-btn" disabled>New tab</button>
    <button class="btn btn-primary" id="apply-btn" disabled>Apply</button>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<script type="module">
import {
  createDraft, draftUrl, isDirty, changeSummary,
  editSegment, editKey, editValue, addParam,
  removeSegment, removeEntry, restoreRemoved, revert, rebase,
} from './draft.js?v=2';
import { SAMPLES, peel, badgeFor, encodeQueryPart, parseUrl, buildUrl } from './proto-core.js?v=2';

const $ = id => document.getElementById(id);

let draft = createDraft(SAMPLES.typical);
let selection = new Set();   // uids
let anchor = null;           // for shift-range
let splitOpen = new Set();   // uids of values shown pulled apart
let tray = null;             // { uid, model } for the nested URL being edited

// --- helpers ----------------------------------------------------------

const segUid = s => s.uid;
const allBricks = () => [
  ...draft.work.segments.map(s => ({ kind: 'segment', item: s })),
  ...draft.work.entries.map(e => ({ kind: 'entry', item: e })),
];
const find = uid => allBricks().find(b => b.item.uid === uid) || null;

const baseIndexOf = item => {
  const m = /^(seg|ent)-(\d+)$/.exec(item.uid);
  return m ? Number(m[2]) : null;
};

/**
 * Which parts sit out of their original order. A reorder changes no text at
 * all, so it needs its own marker or dragging a brick would look like a
 * no-op: a part is "moved" when another part that started before it now sits
 * after it.
 */
function movedUids(list) {
  const idx = list.map(baseIndexOf);
  const out = new Set();
  for (let i = 0; i < list.length; i += 1) {
    if (idx[i] === null) continue;
    for (let j = 0; j < list.length; j += 1) {
      if (idx[j] === null) continue;
      if ((j < i && idx[j] > idx[i]) || (j > i && idx[j] < idx[i])) { out.add(list[i].uid); break; }
    }
  }
  return out;
}

let movedNow = new Set();

/** Changed OR moved, since a reorder leaves every part's text untouched. */
function statusOf(kind, item) {
  const base = baseIndexOf(item);
  if (base === null) return 'added';
  const orig = (kind === 'segment' ? draft.base.segments : draft.base.entries)[base];
  if (!orig) return 'added';
  const same = kind === 'segment'
    ? orig.raw === item.raw
    : orig.rawKey === item.rawKey && orig.rawValue === item.rawValue;
  if (!same) return 'changed';
  return movedNow.has(item.uid) ? 'moved' : '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// --- render -----------------------------------------------------------

function brick(opts) {
  const el = document.createElement('div');
  el.className = 'brick ' + (opts.cls || '');
  el.tabIndex = 0;
  if (opts.uid) {
    el.dataset.uid = opts.uid;
    el.draggable = true;
    if (selection.has(opts.uid)) el.classList.add('sel');
  }
  el.innerHTML = opts.html;
  if (opts.label) el.setAttribute('aria-label', opts.label);
  return el;
}

function row(glyph, title) {
  const r = document.createElement('div');
  r.className = 'row';
  const g = document.createElement('span');
  g.className = 'row-glyph';
  g.textContent = glyph;
  g.title = `Select the whole ${title}`;
  g.dataset.group = title;
  const wrap = document.createElement('div');
  wrap.className = 'bricks';
  r.append(g, wrap);
  return { r, wrap };
}

function valueHtml(entry) {
  if (entry.rawValue === null) return '';
  const plain = peel(entry.rawValue).at(-1).text;
  if (splitOpen.has(entry.uid)) {
    const parts = entry.value.split(/([,|;])/);
    return '<span class="bsep">=</span><span class="bv">'
      + parts.filter((p, i) => i % 2 === 0).map((p, i) =>
        `<span class="sub" data-sub="${i}">${escapeHtml(p)}</span>`).join('<span class="bsep">,</span>')
      + '</span>';
  }
  return '<span class="bsep">=</span><span class="bv txt" data-field="value">'
    + escapeHtml(plain) + '</span>';
}

function ghostBrick(wrap, g) {
  const el = brick({ cls: 'ghost', html: `<span class="bs">${escapeHtml(g.label)}</span>` });
  el.dataset.restore = g.uid;
  el.title = 'Put it back';
  wrap.append(el);
}

function addBrick(wrap, kind, text) {
  const el = brick({ cls: 'add-brick', html: text, label: text });
  el.dataset.add = kind;
  wrap.append(el);
}

function render() {
  const canvas = $('canvas');
  canvas.innerHTML = '';
  movedNow = new Set([
    ...movedUids(draft.work.segments),
    ...movedUids(draft.work.entries),
  ]);

  // origin
  {
    const { r, wrap } = row('⌂', 'origin');
    const u = new URL(draftUrl(draft));
    wrap.append(brick({ cls: 'fixed', html: `<span>${escapeHtml(u.protocol)}//</span>` }));
    wrap.append(brick({ cls: 'origin', html: `<span class="bo txt">${escapeHtml(u.hostname)}</span>`, label: 'host' }));
    if (u.port) wrap.append(brick({ cls: 'origin', html: `<span class="bo">:${u.port}</span>`, label: 'port' }));
    canvas.append(r);
  }

  // path
  {
    const { r, wrap } = row('/', 'path');
    draft.work.segments.forEach((s, i) => {
      const badge = badgeFor(s.raw);
      wrap.append(brick({
        uid: s.uid,
        cls: statusOf('segment', s),
        label: `Path segment ${i + 1}: ${s.text}`,
        html: `<span class="bs txt" data-field="seg">${escapeHtml(s.text)}</span>`
          + (badge && badge !== 'encoded' ? `<span class="badge ${badge}">${badge}</span>` : ''),
      }));
    });
    for (const g of draft.removed.filter(x => x.kind === 'segment')) ghostBrick(wrap, g);
    addBrick(wrap, 'segment', '+ segment');
    canvas.append(r);
  }

  // query
  {
    const { r, wrap } = row('?', 'query');
    draft.work.entries.forEach((e, i) => {
      const badge = e.rawValue === null ? null : badgeFor(e.rawValue);
      wrap.append(brick({
        uid: e.uid,
        cls: statusOf('entry', e) + (splitOpen.has(e.uid) ? ' split' : ''),
        label: `Parameter ${e.key}${e.rawValue === null ? '' : ' = ' + e.value}`,
        html: `<span class="bk txt" data-field="key">${escapeHtml(e.key)}</span>`
          + valueHtml(e)
          + (badge === 'encoded' ? '<span class="badge encoded" title="percent-encoded in the URL">%</span>'
            : badge ? `<span class="badge ${badge}">${badge}</span>` : ''),
      }));
    });
    for (const g of draft.removed.filter(x => x.kind === 'entry')) ghostBrick(wrap, g);
    addBrick(wrap, 'entry', '+ param');
    canvas.append(r);
  }

  // hash
  if (draft.work.hash) {
    const { r, wrap } = row('#', 'fragment');
    wrap.append(brick({ cls: '', html: `<span class="bh txt">${escapeHtml(draft.work.hash.slice(1))}</span>` }));
    canvas.append(r);
  }

  renderToolbar();
  renderPreview();
  renderChrome();
  renderTray();
}

function renderPreview() {
  const url = draftUrl(draft);
  document.getElementById('pv-url').textContent = url;
  document.getElementById('preview').classList.toggle('dirty', url !== buildUrl(draft.base));
}

function renderToolbar() {
  const n = selection.size;
  $('toolbar').classList.toggle('idle', n === 0);
  const one = n === 1 ? find([...selection][0]) : null;
  $('what').innerHTML = n === 0
    ? 'Nothing selected'
    : n === 1
      ? `<b>${escapeHtml(one ? label(one) : '')}</b>`
      : `<b>${n} parts</b> selected`;

  const value = one && one.kind === 'entry' && one.item.rawValue !== null ? one.item : null;
  const splittable = value && /[,|;]/.test(value.value);
  const nested = value && peel(value.rawValue).at(-1).isUrl;
  $('toolbar').querySelector('[data-act="split"]').disabled = !splittable;
  $('toolbar').querySelector('[data-act="inside"]').disabled = !nested;
  for (const a of ['copy', 'copy-plain', 'del']) {
    $('toolbar').querySelector(`[data-act="${a}"]`).disabled = n === 0;
  }
}

function label(b) {
  return b.kind === 'segment' ? b.item.text
    : b.item.rawValue === null ? b.item.key : `${b.item.key}=${b.item.value}`;
}

function renderChrome() {
  const reordered = movedNow.size > 0;
  const dirty = isDirty(draft) || reordered;
  const staged = changeSummary(draft);
  $('change-summary').textContent = !dirty ? 'No unapplied changes'
    : reordered && !isDirty(draft) ? 'Reordered - unapplied'
      : reordered ? `${staged} + reorder` : staged;
  $('status-bar').classList.toggle('dirty', dirty);
  for (const id of ['apply-btn', 'new-btn', 'revert-btn']) $(id).disabled = !dirty;
}

// --- selection --------------------------------------------------------

function orderedUids() {
  return allBricks().map(b => b.item.uid);
}

function pick(uid, e) {
  if (e && (e.metaKey || e.ctrlKey)) {
    selection.has(uid) ? selection.delete(uid) : selection.add(uid);
    anchor = uid;
  } else if (e && e.shiftKey && anchor) {
    const all = orderedUids();
    const a = all.indexOf(anchor), b = all.indexOf(uid);
    if (a !== -1 && b !== -1) {
      selection = new Set(all.slice(Math.min(a, b), Math.max(a, b) + 1));
    }
  } else {
    selection = new Set([uid]);
    anchor = uid;
  }
  render();
}

function selectGroup(group) {
  const list = group === 'path' ? draft.work.segments
    : group === 'query' ? draft.work.entries : [];
  selection = new Set(list.map(segUid));
  anchor = list.length ? list[0].uid : null;
  render();
}

// --- editing in place -------------------------------------------------

function editInPlace(brickEl, field) {
  const uid = brickEl.dataset.uid;
  const b = find(uid);
  if (!b) return;
  const target = brickEl.querySelector(`[data-field="${field}"]`);
  if (!target) return;

  const current = field === 'seg' ? b.item.text : field === 'key' ? b.item.key : b.item.value;
  const input = document.createElement('input');
  input.value = current;
  input.size = Math.max(4, current.length);
  input.setAttribute('aria-label', 'Edit ' + field);
  target.replaceWith(input);
  input.focus();
  input.select();                     // type-over: the whole piece is armed
  brickEl.draggable = false;

  // Enter commits and re-renders, which removes the input and fires blur; the
  // guard keeps that second call from re-running the edit.
  let committed = false;
  const commit = ok => {
    if (committed) return;
    committed = true;
    if (!ok) { render(); return; }
    const i = b.kind === 'segment'
      ? draft.work.segments.indexOf(b.item)
      : draft.work.entries.indexOf(b.item);
    const r = field === 'seg' ? editSegment(draft, i, input.value)
      : field === 'key' ? editKey(draft, i, input.value)
        : editValue(draft, i, input.value);
    if (!r.ok) flash(r.error, true);
    render();
  };

  input.addEventListener('blur', () => commit(true));
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(true); }
    if (e.key === 'Escape') { e.preventDefault(); commit(false); }
    if (e.key === 'Tab') { e.preventDefault(); commit(true); }
  });
  input.addEventListener('input', () => { input.size = Math.max(4, input.value.length); });
}

// --- actions ----------------------------------------------------------

function selectedBricks() {
  return orderedUids().filter(u => selection.has(u)).map(find).filter(Boolean);
}

function doCopy(plain) {
  const picked = selectedBricks();
  if (picked.length === 0) return;
  const text = picked.map(b => {
    if (b.kind === 'segment') return plain ? b.item.text : b.item.raw;
    if (b.item.rawValue === null) return b.item.key;
    return plain ? b.item.value : `${b.item.rawKey}=${b.item.rawValue}`;
  }).join(plain ? '\n' : picked[0].kind === 'segment' ? '/' : '&');
  copy(text);
}

function doDelete() {
  for (const b of selectedBricks().reverse()) {
    if (b.kind === 'segment') removeSegment(draft, draft.work.segments.indexOf(b.item));
    else removeEntry(draft, draft.work.entries.indexOf(b.item));
  }
  selection.clear();
  render();
}

function moveBrick(uid, targetUid, before) {
  const b = find(uid), t = find(targetUid);
  if (!b || !t || b.kind !== t.kind) { flash('A part only moves inside its own row.', true); return; }
  const list = b.kind === 'segment' ? draft.work.segments : draft.work.entries;
  const from = list.indexOf(b.item);
  list.splice(from, 1);
  let to = list.indexOf(t.item);
  if (!before) to += 1;
  list.splice(to, 0, b.item);
  render();
}

// --- nested tray ------------------------------------------------------

function openTray(uid) {
  const b = find(uid);
  if (!b || b.kind !== 'entry') return;
  const inner = peel(b.item.rawValue).at(-1).text;
  const model = parseUrl(inner);
  if (!model) { flash('That value is not a URL.', true); return; }
  model.segments.forEach((s, i) => { s.uid = `t-seg-${i}`; });
  model.entries.forEach((e, i) => { e.uid = `t-ent-${i}`; });
  tray = { uid, model };
  render();
}

function renderTray() {
  const box = $('tray');
  if (!tray) { box.classList.add('hidden'); box.innerHTML = ''; return; }
  const b = find(tray.uid);
  if (!b) { tray = null; box.classList.add('hidden'); return; }

  box.classList.remove('hidden');
  box.innerHTML = `<div class="tray-head">inside <b>${escapeHtml(b.item.key)}</b>
    <span class="spacer"></span>
    <button class="btn btn-primary" data-tray="save">Put it back</button>
    <button class="btn" data-tray="close">Close</button></div>`;

  const list = document.createElement('div');
  list.className = 'bricks';
  const u = new URL(buildUrl(tray.model));
  const host = document.createElement('div');
  host.className = 'brick fixed';
  host.innerHTML = `<span class="bo">${escapeHtml(u.host)}</span>`;
  list.append(host);
  tray.model.segments.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'brick';
    el.tabIndex = 0;
    el.dataset.tseg = i;
    el.innerHTML = `<span class="bs txt">${escapeHtml(s.text)}</span>`;
    list.append(el);
  });
  tray.model.entries.forEach((e, i) => {
    const el = document.createElement('div');
    el.className = 'brick';
    el.tabIndex = 0;
    el.dataset.tent = i;
    el.innerHTML = `<span class="bk">${escapeHtml(e.key)}</span><span class="bsep">=</span>`
      + `<span class="bv txt">${escapeHtml(e.value)}</span>`;
    list.append(el);
  });
  box.append(list);
}

$('tray').addEventListener('click', e => {
  const act = e.target.closest('[data-tray]');
  if (act) {
    if (act.dataset.tray === 'close') { tray = null; render(); return; }
    const b = find(tray.uid);
    const i = draft.work.entries.indexOf(b.item);
    editValue(draft, i, buildUrl(tray.model));
    tray = null;
    render();
    flash('Nested URL written back, re-encoded.');
    return;
  }
  const el = e.target.closest('[data-tseg],[data-tent]');
  if (!el) return;
  const isSeg = el.dataset.tseg !== undefined;
  const item = isSeg ? tray.model.segments[+el.dataset.tseg] : tray.model.entries[+el.dataset.tent];
  const current = isSeg ? item.text : item.value;
  const input = document.createElement('input');
  input.value = current;
  input.size = Math.max(4, current.length);
  el.querySelector('.txt').replaceWith(input);
  input.focus(); input.select();
  const commit = () => {
    if (isSeg) { item.text = input.value; item.raw = encodeURIComponent(input.value).replace(/%2F/g, '/'); }
    else { item.value = input.value; item.rawValue = encodeQueryPart(input.value); }
    renderTray();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', ev => {
    ev.stopPropagation();
    if (ev.key === 'Enter') commit();
  });
});

// --- events -----------------------------------------------------------

$('canvas').addEventListener('click', e => {
  const glyph = e.target.closest('.row-glyph');
  if (glyph) { selectGroup(glyph.dataset.group); return; }

  const add = e.target.closest('[data-add]');
  if (add) {
    if (add.dataset.add === 'segment') {
      draft.work.segments.push({ raw: 'new', text: 'new', uid: `seg-new-${Date.now()}` });
      render();
      const last = [...$('canvas').querySelectorAll('.brick')].reverse()
        .find(el => el.dataset.uid && el.dataset.uid.startsWith('seg-new'));
      if (last) editInPlace(last, 'seg');
    } else {
      addParam(draft, 'key', 'value');
      render();
      const el = [...$('canvas').querySelectorAll('.brick')].reverse()
        .find(x => x.dataset.uid && x.dataset.uid.startsWith('ent-new'));
      if (el) editInPlace(el, 'key');
    }
    return;
  }

  const ghost = e.target.closest('[data-restore]');
  if (ghost) { restoreRemoved(draft, ghost.dataset.restore); render(); return; }

  const sub = e.target.closest('.sub');
  if (sub) { sub.classList.toggle('gone'); return; }

  const el = e.target.closest('.brick[data-uid]');
  if (el) pick(el.dataset.uid, e);
  else { selection.clear(); render(); }
});

$('canvas').addEventListener('dblclick', e => {
  const el = e.target.closest('.brick[data-uid]');
  if (!el) return;
  const field = e.target.closest('[data-field]');
  editInPlace(el, field ? field.dataset.field : (find(el.dataset.uid).kind === 'segment' ? 'seg' : 'key'));
});

// drag to reorder
let dragUid = null;
$('canvas').addEventListener('dragstart', e => {
  const el = e.target.closest('.brick[data-uid]');
  if (!el) return;
  dragUid = el.dataset.uid;
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragUid);
});
$('canvas').addEventListener('dragover', e => {
  const el = e.target.closest('.brick[data-uid]');
  if (!el || el.dataset.uid === dragUid) return;
  e.preventDefault();
  const box = el.getBoundingClientRect();
  const before = e.clientX < box.left + box.width / 2;
  for (const n of $('canvas').querySelectorAll('.drop-before,.drop-after')) {
    n.classList.remove('drop-before', 'drop-after');
  }
  el.classList.add(before ? 'drop-before' : 'drop-after');
});
$('canvas').addEventListener('drop', e => {
  const el = e.target.closest('.brick[data-uid]');
  if (!el || !dragUid) return;
  e.preventDefault();
  const before = el.classList.contains('drop-before');
  moveBrick(dragUid, el.dataset.uid, before);
  dragUid = null;
});
$('canvas').addEventListener('dragend', () => {
  dragUid = null;
  for (const n of $('canvas').querySelectorAll('.dragging,.drop-before,.drop-after')) {
    n.classList.remove('dragging', 'drop-before', 'drop-after');
  }
});

// keyboard
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const bricks = [...$('canvas').querySelectorAll('.brick[data-uid]')];
  const at = bricks.indexOf(document.activeElement);

  // Selecting re-renders, which detaches the focused chip, so focus is always
  // restored by uid rather than by holding on to the element.
  const focusUid = uid => {
    const el = $('canvas').querySelector(`.brick[data-uid="${uid}"]`);
    if (el) el.focus();
  };

  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const step = e.key === 'ArrowRight' ? 1 : -1;
    const next = bricks[at === -1 ? 0 : Math.max(0, Math.min(bricks.length - 1, at + step))];
    if (!next) return;
    const uid = next.dataset.uid;
    if (!e.shiftKey) pick(uid, null);
    focusUid(uid);
  } else if (e.key === ' ' && at !== -1) {
    e.preventDefault();
    const uid = bricks[at].dataset.uid;
    pick(uid, { metaKey: true });
    focusUid(uid);
  } else if (e.key === 'Enter' && at !== -1) {
    e.preventDefault();
    const uid = bricks[at].dataset.uid;
    const live = $('canvas').querySelector(`.brick[data-uid="${uid}"]`);
    if (live) editInPlace(live, find(uid).kind === 'segment' ? 'seg' : 'value');
  } else if ((e.key === 'Backspace' || e.key === 'Delete') && selection.size) {
    e.preventDefault();
    doDelete();
  } else if (e.key === 'Escape') {
    selection.clear(); tray = null; render();
  } else if ((e.metaKey || e.ctrlKey) && e.key === 'c' && selection.size) {
    e.preventDefault(); doCopy(false);
  }
});

$('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.act;
  if (act === 'copy') doCopy(false);
  else if (act === 'copy-plain') doCopy(true);
  else if (act === 'del') doDelete();
  else if (act === 'split') {
    const uid = [...selection][0];
    splitOpen.has(uid) ? splitOpen.delete(uid) : splitOpen.add(uid);
    render();
  } else if (act === 'inside') openTray([...selection][0]);
});

// --- chrome -----------------------------------------------------------

// navigator.clipboard is unavailable in an opaque origin, which is what an
// embedded review frame is, so fall back to the old selection trick before
// telling the user it failed.
function copy(s) {
  const done = () => flash('Copied: ' + (s.length > 38 ? s.slice(0, 38) + '…' : s));
  const legacy = () => {
    const ta = document.createElement('textarea');
    ta.value = s;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.append(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    ta.remove();
    ok ? done() : flash('Clipboard blocked here - open this prototype in its own tab.', true);
  };
  if (!navigator.clipboard) { legacy(); return; }
  navigator.clipboard.writeText(s).then(done, legacy);
}

let toastTimer = null;
function flash(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!bad);
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
}

$('copy-url').onclick = () => copy(draftUrl(draft));

$('apply-btn').onclick = () => {
  rebase(draft);
  selection.clear();
  render();
  flash('Applied - the tab would navigate here.');
};
$('new-btn').onclick = () => flash('Would open a new tab at the edited URL.');
$('revert-btn').onclick = () => { revert(draft); selection.clear(); splitOpen.clear(); tray = null; render(); };

for (const btn of document.querySelectorAll('[data-sample]')) {
  btn.onclick = () => {
    for (const b of document.querySelectorAll('[data-sample]')) b.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-pressed', 'true');
    draft = createDraft(SAMPLES[btn.dataset.sample]);
    selection.clear(); splitOpen.clear(); tray = null;
    render();
  };
}

render();
</script>
</body>
</html>
