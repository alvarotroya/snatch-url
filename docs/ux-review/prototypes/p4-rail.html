<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snatch URL · D · Rail</title>
<link rel="icon" href="data:,">
<style>
/* Shared chrome for the three prototypes.
   Catppuccin Mocha, same stack as the shipped popup (styles.css), so the
   comparison is about the editing surface and not about the paint. */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --base: #1e1e2e;
  --mantle: #181825;
  --crust: #11111b;
  --surface0: #313244;
  --surface1: #45475a;
  --surface2: #585b70;
  --text: #cdd6f4;
  --muted: #a6adc8;
  --mauve: #cba6f7;
  --blue: #89b4fa;
  --green: #a6e3a1;
  --peach: #fab387;
  --yellow: #f9e2af;
  --red: #f38ba8;
  --teal: #94e2d5;
  --lavender: #b4befe;
  --pink: #f5c2e7;
  --staged: #f9e2af;
  --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
}

/* One colour per role, identical in all three prototypes. */
.r-scheme, .r-sep, .r-qmark, .r-eq, .r-amp { color: var(--surface2); }
.r-host { color: var(--mauve); }
.r-userinfo { color: var(--pink); }
.r-port { color: var(--pink); }
.r-seg { color: var(--peach); }
.r-key { color: var(--blue); }
.r-val { color: var(--green); }
.r-hash { color: var(--teal); }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 14px;
  background: var(--base);
  color: var(--text);
  overflow: hidden;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
}

/* --- Demo scaffolding (NOT part of any design) --- */
.demo-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  background: var(--crust);
  border-bottom: 1px dashed var(--surface1);
  font-size: 10px;
  color: var(--surface2);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  flex-shrink: 0;
}
.demo-bar .demo-tag { color: var(--surface2); margin-right: 2px; }
.demo-bar button {
  background: transparent;
  border: 1px solid var(--surface0);
  border-radius: 999px;
  color: var(--muted);
  font: inherit;
  padding: 2px 8px;
  cursor: pointer;
}
.demo-bar button[aria-pressed="true"] { background: var(--surface0); color: var(--text); border-color: var(--surface1); }
.demo-bar .spacer { flex: 1; }

/* --- Header --- */
header {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 9px 12px 7px;
  background: var(--mantle);
  border-bottom: 1px solid var(--surface0);
  flex-shrink: 0;
}
header h1 {
  font-size: 12px;
  font-weight: 700;
  color: var(--mauve);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
header .variant {
  font-size: 11px;
  color: var(--muted);
  flex: 1;
  text-align: right;
}

/* --- Shared bottom bars --- */
.status-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  border-top: 1px solid var(--surface0);
  background: var(--mantle);
  flex-shrink: 0;
}
.change-summary { flex: 1; font-size: 11px; color: var(--muted); min-width: 0; }
.status-bar.dirty .change-summary { color: var(--staged); font-weight: 600; }

.btn {
  background: var(--surface0);
  border: 1px solid var(--surface1);
  border-radius: 4px;
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  padding: 4px 9px;
  white-space: nowrap;
  transition: background 0.1s, border-color 0.1s;
}
.btn:hover { background: var(--surface1); }
.btn-primary { background: var(--mauve); border-color: var(--mauve); color: var(--base); font-weight: 600; }
.btn-primary:hover { background: var(--lavender); border-color: var(--lavender); }
.btn-danger { color: var(--red); }
.btn-danger:hover { background: #3d2a2e; border-color: var(--red); }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:disabled:hover { background: var(--surface0); }
.btn-primary:disabled:hover { background: var(--mauve); }

.toast {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 46px;
  padding: 7px 10px;
  border-radius: 5px;
  background: #2a3d2e;
  color: var(--green);
  border: 1px solid var(--green);
  font-size: 12px;
  z-index: 40;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
}
.toast.err { background: #3d2a2e; color: var(--red); border-color: var(--red); }
.hidden { display: none !important; }

:focus-visible { outline: 2px solid var(--mauve); outline-offset: 1px; }

/* Thin scrollbars everywhere. */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 3px; }

/* --- Keyboard hint strip --- */
.keys {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  padding: 5px 12px;
  background: var(--crust);
  border-top: 1px solid var(--surface0);
  font-size: 10px;
  color: var(--surface2);
  flex-shrink: 0;
}
.keys kbd {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  background: var(--surface0);
  border-radius: 3px;
  padding: 0 4px;
}

/* --- Badges --- */
.badge {
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-radius: 3px;
  padding: 1px 4px;
  background: var(--surface0);
  color: var(--muted);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  vertical-align: 1px;
}
.badge.encoded { color: var(--yellow); }
.badge.url { color: var(--teal); }
.badge.base64, .badge.jwt { color: var(--pink); }
.badge.json { color: var(--lavender); }

</style>
<style>
/* --- D: the URL is a rail of sections, each one a dropdown ------------ */

#app { overflow: hidden; width: 100%; }

/* The rail: one horizontal strip, scrolls sideways, never the page. */
#rail-wrap { position: relative; flex-shrink: 0; background: var(--mantle); border-bottom: 1px solid var(--surface0); }
#rail {
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  overflow-y: hidden;
  scrollbar-width: thin;
}
/* Fades at the edges say "there is more this way". */
#rail-wrap::before, #rail-wrap::after {
  content: '';
  position: absolute;
  top: 0; bottom: 0;
  width: 26px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  z-index: 1;
}
#rail-wrap::before { left: 0; background: linear-gradient(to right, var(--mantle), transparent); }
#rail-wrap::after { right: 0; background: linear-gradient(to left, var(--mantle), transparent); }
#rail-wrap.more-left::before, #rail-wrap.more-right::after { opacity: 1; }
.cell {
  --sec: var(--muted);
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 12px 8px 10px;
  border: none;
  border-right: 1px solid var(--surface0);
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: nowrap;
  cursor: pointer;
  position: relative;
}
.cell:last-child { border-right: none; }
.cell:hover { background: var(--surface0); }
.cell.open { background: var(--base); border-bottom-color: var(--sec); }
.cell:focus-visible { outline: 2px solid var(--lavender); outline-offset: -2px; }
.cell .glyph {
  color: var(--sec);
  font-weight: 700;
  width: 12px;
  text-align: center;
}
.cell .sum { display: inline-flex; align-items: baseline; gap: 0; }
.cell .sum .r-sep { padding: 0 3px; }
.cell .dim { color: var(--surface2); font-style: italic; font-family: inherit; }
.cell .caret { color: var(--surface2); font-size: 10px; margin-left: 2px; }
.cell.open .caret { color: var(--sec); }
.cell.changed::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--staged);
}

/* The dropdown panel under the open cell. */
#panel {
  --sec: var(--muted);
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  border-top: 2px solid var(--sec);
  margin-top: -1px;
}
#panel.none { border-top-color: transparent; }
.p-head {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 8px 6px 10px;
  background: var(--crust);
  border-bottom: 1px solid var(--surface0);
  flex-shrink: 0;
  overflow: hidden;
}
.p-title {
  flex: 1;
  min-width: 0;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.p-title b { color: var(--sec); font-weight: 600; }
.p-title .n { color: var(--text); }
.p-head .btn { padding: 3px 7px; font-size: 10.5px; }
.p-head .btn:disabled { opacity: 0.3; }

.p-list { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

.hint {
  padding: 22px 16px;
  font-size: 12px;
  color: var(--surface2);
  text-align: center;
  line-height: 1.5;
}
.hint b { color: var(--muted); font-weight: 600; }

/* Rows */
.row {
  display: flex;
  flex-direction: column;
  border-bottom: 1px solid var(--surface0);
  border-left: 3px solid transparent;
  outline: none;
  cursor: default;
}
.row-line {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px 5px 6px;
  min-height: 30px;
}
.row:hover { background: #24243a; }
.row.sel { background: #2c2a44; border-left-color: var(--sec); }
.row:focus-visible { box-shadow: inset 0 0 0 2px var(--lavender); }
.row.changed { border-left-color: var(--staged); }
.row.changed .idx { color: var(--staged); }
.row .idx {
  flex-shrink: 0;
  width: 18px;
  text-align: right;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--surface2);
  user-select: none;
}
.row .body {
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: flex;
  align-items: center;
  gap: 0;
}
.row .body .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .body .r-val { flex: 1; min-width: 0; }
.row .body .r-key { flex-shrink: 0; max-width: 45%; }
.row .body .r-eq { padding: 0 4px; flex-shrink: 0; }
.row .body .bare { color: var(--surface2); font-size: 10px; margin-left: 6px; font-family: inherit; flex-shrink: 0; }
.row.editing .body { overflow: visible; text-overflow: clip; }
.row .body input {
  flex: 1;
  min-width: 40px;
  width: 100%;
  font-family: var(--mono);
  font-size: 12.5px;
  background: var(--crust);
  border: 1px solid var(--sec);
  border-radius: 3px;
  outline: none;
  color: var(--text);
  padding: 1px 4px;
}
.row .body input.k { flex: 0 1 38%; min-width: 50px; }
.row .badge {
  flex-shrink: 0;
  cursor: pointer;
  border: 1px solid transparent;
  background: var(--surface0);
}
.row .badge:hover, .row.expanded .badge { border-color: currentColor; }
.row .acts { display: flex; gap: 1px; flex-shrink: 0; opacity: 0; transition: opacity 0.08s; }
.row:hover .acts, .row.sel .acts, .row:focus-within .acts, .row:focus-visible .acts { opacity: 1; }
.ico {
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
  font-family: var(--mono);
}
.ico:hover { background: var(--surface1); color: var(--text); }
.ico.del:hover { color: var(--red); }
.ico:disabled { opacity: 0.25; cursor: default; }
.ico:disabled:hover { background: transparent; color: var(--muted); }

/* Peeled layers under an expanded row */
.layers { padding: 0 8px 8px 27px; display: flex; flex-direction: column; gap: 5px; }
.layer { background: var(--crust); border-radius: 4px; padding: 4px 6px 5px; border: 1px solid var(--surface0); }
.layer-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.layer-label { font-size: 9.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--surface2); flex: 1; }
.layer pre {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--muted);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 120px;
  overflow-y: auto;
  user-select: text;
}
.layer.last pre { color: var(--text); }

.row.phantom { background: #22283a; border-left-color: var(--sec); }
.row.phantom .idx { color: var(--sec); }

/* The URL this adds up to. */
#raw {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 6px 10px;
  background: var(--crust);
  border-top: 1px solid var(--surface0);
  border-left: 3px solid transparent;
  flex-shrink: 0;
}
#raw.dirty { border-left-color: var(--staged); }
.raw-label {
  font-size: 9px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--surface2);
  padding-top: 2px;
  flex-shrink: 0;
  width: 24px;
}
.raw-url {
  flex: 1;
  min-width: 0;
  font-family: var(--mono);
  font-size: 10.5px;
  line-height: 1.4;
  overflow-wrap: anywhere;
  max-height: 30px;
  overflow-y: auto;
  user-select: text;
}
#raw .btn { padding: 2px 7px; font-size: 10px; }
</style>

<body>
<div id="app">

  <div class="demo-bar">
    <span class="demo-tag">demo url</span>
    <button data-sample="short">short</button>
    <button data-sample="typical" aria-pressed="true">typical</button>
    <button data-sample="monster">monster</button>
    <span class="spacer"></span>
    <span>440 × 600</span>
  </div>

  <header>
    <h1>Snatch URL</h1>
    <span class="variant">D · Rail</span>
  </header>

  <div id="rail-wrap"><div id="rail" role="tablist" aria-label="URL sections"></div></div>

  <div id="panel">
    <div class="p-head" id="p-head"></div>
    <div class="p-list" id="p-list"></div>
  </div>

  <div id="raw">
    <span class="raw-label">url</span>
    <span class="raw-url" id="raw-url"></span>
    <button class="btn" id="copy-url">Copy URL</button>
  </div>

  <div class="keys">
    <span><kbd>←→</kbd> section</span>
    <span><kbd>↵/↓</kbd> open</span>
    <span><kbd>↑↓</kbd> rows</span>
    <span><kbd>↵</kbd> type over</span>
    <span><kbd>space</kbd> pick</span>
    <span><kbd>⇧↑↓</kbd> range</span>
    <span><kbd>⌫</kbd> delete</span>
    <span><kbd>⌘C</kbd> copy</span>
    <span><kbd>esc</kbd> close</span>
  </div>

  <div class="status-bar" id="status-bar">
    <span class="change-summary" id="change-summary" role="status">No unapplied changes</span>
    <button class="btn" id="revert-btn" disabled>Revert</button>
    <button class="btn" id="new-btn" disabled>New tab</button>
    <button class="btn btn-primary" id="apply-btn" disabled>Apply</button>
  </div>

  <div class="toast hidden" id="toast"></div>
</div>

<script type="module">
// Bundled by build.js - see that file for why this is inline.
// ---- url-model.js ----
// Snatch URL - url-model.js
//
// A raw-preserving URL model.
//
// The rule this module exists for: an edit must change only the part it
// touches. Every untouched byte of the path and query survives a parse ->
// build round trip exactly as it arrived, so `%20` stays `%20`, `a,b` stays
// `a,b`, a bare `debug` stays bare, and a trailing slash is kept.
//
// To do that the model stores the RAW text of every segment and every
// key/value, and only re-encodes the single part an edit touches. Decoded
// text is carried alongside for display, and decoding never throws: a
// malformed escape like `%zz` falls back to the raw text.

// --- Encoding ---

// Characters that are legal unescaped inside a path segment (RFC 3986 pchar:
// sub-delims plus ":" and "@"). encodeURIComponent escapes them, so we put
// them back, which is what keeps `me@corp.com` readable in a segment.
const SEGMENT_KEEP = /%(2C|3B|3A|40|24|26|2B|3D|21|27|28|29|2A)/gi;

// Same idea for a query part, minus the characters that would end or split
// the part itself: `&`, `=`, `+` and `#` stay escaped.
const QUERY_KEEP = /%(2C|3B|3A|40|24|2F|3F|21|27|28|29|2A)/gi;

function encodeWith(keep, text) {
  return encodeURIComponent(text).replace(keep, m => decodeURIComponent(m));
}

function encodeSegment(text) {
  return encodeWith(SEGMENT_KEEP, text);
}

function encodeQueryPart(text) {
  return encodeWith(QUERY_KEEP, text);
}

// --- Decoding ---

/** decodeURIComponent that returns the raw text instead of throwing. */
function safeDecode(raw) {
  try {
    return decodeURIComponent(raw);
  } catch {
    return raw;
  }
}

/** A query part also decodes `+` as a space, the way a browser form does. */
function decodeQueryPart(raw) {
  try {
    return decodeURIComponent(raw.replace(/\+/g, '%20'));
  } catch {
    return raw.replace(/\+/g, ' ');
  }
}

// --- Parse ---

/**
 * @typedef {Object} Segment
 * @property {string} raw   the segment exactly as it appears in the URL
 * @property {string} text  the decoded segment, for display and editing
 *
 * @typedef {Object} Entry
 * @property {string} rawKey
 * @property {string|null} rawValue  null for a bare flag such as `debug`
 * @property {string} key
 * @property {string} value
 *
 * @typedef {Object} UrlModel
 * @property {string} href           the original URL, untouched
 * @property {string} prefix         everything before the path (scheme, host, port)
 * @property {Segment[]} segments
 * @property {boolean} trailingSlash
 * @property {Entry[]} entries
 * @property {boolean} hasQuery      whether the URL carried a `?` at all
 * @property {string} hash           the raw hash including `#`, or ''
 */

/**
 * @param {string} url
 * @returns {UrlModel|null} null when the URL cannot be parsed
 */
function parseUrl(url) {
  let u;
  try {
    u = new URL(url);
  } catch {
    return null;
  }

  const tail = u.pathname + u.search + u.hash;
  const prefix = u.href.endsWith(tail)
    ? u.href.slice(0, u.href.length - tail.length)
    : u.origin;

  return {
    href: u.href,
    prefix,
    ...parsePath(u.pathname),
    entries: parseQuery(u.search),
    hasQuery: u.search !== '',
    hash: u.hash,
  };
}

function parsePath(pathname) {
  // An empty path segment is real (`/a//b`) and is preserved, so this keeps
  // every `/` the URL had. Only a trailing one is lifted out into a flag.
  const parts = pathname.startsWith('/') ? pathname.slice(1).split('/') : pathname.split('/');
  let trailingSlash = false;
  if (parts.length > 0 && parts[parts.length - 1] === '') {
    parts.pop();
    trailingSlash = true;
  }
  return {
    segments: parts.map(raw => ({ raw, text: safeDecode(raw) })),
    trailingSlash,
  };
}

function parseQuery(search) {
  const q = search.startsWith('?') ? search.slice(1) : search;
  if (q === '') return [];
  // An empty chunk (`a=1&&b=2`) carries nothing to edit, so it is dropped.
  return q.split('&').filter(chunk => chunk !== '').map(toEntry);
}

function toEntry(chunk) {
  const eq = chunk.indexOf('=');
  const rawKey = eq === -1 ? chunk : chunk.slice(0, eq);
  const rawValue = eq === -1 ? null : chunk.slice(eq + 1);
  return {
    rawKey,
    rawValue,
    key: decodeQueryPart(rawKey),
    value: rawValue === null ? '' : decodeQueryPart(rawValue),
  };
}

// --- Origin ---

/**
 * The prefix split into its parts for display: scheme, optional user info,
 * host, optional port. Joined back they are exactly `model.prefix`. When the
 * arithmetic does not add up - an exotic URL the WHATWG parser normalises in a
 * way the prefix does not follow - the whole prefix is returned as one host
 * part rather than offsets that lie. Nothing here is rebuilt from the parts.
 *
 * @param {UrlModel} model
 * @returns {{role: 'scheme'|'userinfo'|'host'|'port', raw: string}[]}
 */
function originParts(model) {
  const whole = [{ role: 'host', raw: model.prefix }];
  let u;
  try {
    u = new URL(model.href);
  } catch {
    return whole;
  }
  const userinfo = u.username + (u.password ? ':' + u.password : '');
  const parts = [
    { role: 'scheme', raw: u.protocol + '//' },
    userinfo ? { role: 'userinfo', raw: userinfo + '@' } : null,
    { role: 'host', raw: u.hostname },
    u.port ? { role: 'port', raw: ':' + u.port } : null,
  ].filter(Boolean);
  return parts.map(p => p.raw).join('') === model.prefix ? parts : whole;
}

// --- Build ---

/** @param {UrlModel} model @returns {string} */
function buildUrl(model) {
  return model.prefix + buildPath(model) + buildQuery(model) + model.hash;
}

function buildPath({ segments, trailingSlash }) {
  if (segments.length === 0) return '/';
  return '/' + segments.map(s => s.raw).join('/') + (trailingSlash ? '/' : '');
}

function buildQuery({ entries }) {
  // Emptying the query drops the `?` too, which is what Clear All should do.
  if (entries.length === 0) return '';
  return '?' + entries
    .map(e => (e.rawValue === null ? e.rawKey : e.rawKey + '=' + e.rawValue))
    .join('&');
}

// --- Edits ---
//
// Every edit returns a result rather than throwing, so the popup can put a
// rejected value back and show a message. Rejected edits leave the model
// untouched.

const OK = { ok: true };
function reject(error) {
  return { ok: false, error };
}

const BLANK_SEGMENT = 'Segment cannot be empty.';
const BLANK_KEY = 'Key cannot be empty.';

/** Replace one path segment. A blank segment is rejected (F6). */
function setSegment(model, index, text) {
  const trimmed = text.trim();
  if (trimmed === '') return reject(BLANK_SEGMENT);
  model.segments[index] = { raw: encodeSegment(trimmed), text: trimmed };
  return OK;
}

function deleteSegment(model, index) {
  model.segments.splice(index, 1);
  return OK;
}

/** Rename one query param. A blank key is rejected (F6). */
function setKey(model, index, text) {
  const trimmed = text.trim();
  if (trimmed === '') return reject(BLANK_KEY);
  const entry = model.entries[index];
  entry.rawKey = encodeQueryPart(trimmed);
  entry.key = trimmed;
  return OK;
}

/**
 * Set one query value. Clearing the value of a bare flag leaves it bare, so
 * `debug` does not silently become `debug=`.
 */
function setValue(model, index, text) {
  const entry = model.entries[index];
  if (text === '' && entry.rawValue === null) return OK;
  entry.rawValue = encodeQueryPart(text);
  entry.value = text;
  return OK;
}

function deleteEntry(model, index) {
  model.entries.splice(index, 1);
  return OK;
}

/** Append a new query param. A blank key is rejected, as Add already did. */
function addEntry(model, key, value) {
  const trimmedKey = key.trim();
  if (trimmedKey === '') return reject(BLANK_KEY);
  model.entries.push({
    rawKey: encodeQueryPart(trimmedKey),
    rawValue: encodeQueryPart(value),
    key: trimmedKey,
    value,
  });
  model.hasQuery = true;
  return OK;
}

function clearEntries(model) {
  model.entries.length = 0;
  return OK;
}

// --- Export ---

/**
 * The model as plain JSON, for Copy All: the decoded path segments in order,
 * and the query as an object where a key that repeats carries an array of its
 * values, so `tag=a&tag=b` is not flattened to the last one (F5).
 *
 * @param {UrlModel} model
 * @returns {{path: string[], query: Object}}
 */
function toJson(model) {
  // A null prototype so a key such as `__proto__` is an ordinary own property.
  const query = Object.create(null);
  for (const { key, value } of model.entries) {
    if (!Object.hasOwn(query, key)) query[key] = value;
    else if (Array.isArray(query[key])) query[key].push(value);
    else query[key] = [query[key], value];
  }
  return { path: model.segments.map(s => s.text), query };
}

// ---- proto-core.js ----
// Shared brain for the three UX prototypes.
//
// It sits on top of the SHIPPED url-model.js, and adds the one thing every
// "touch the URL directly" design needs and the current popup does not have:
// a map from each part of the URL to the exact character range it occupies in
// the URL string. Selection, highlighting, copy-a-piece and type-over-a-piece
// are all splices into that string.
//
// Nothing here re-implements parsing or encoding: parseUrl/buildUrl/encode*
// come from the model, so the raw-preserving invariant still holds.



// --- Sample URLs -------------------------------------------------------
// Demo scaffolding, not part of any design. Three lengths so each design can

    + '&filters=country%3Ade%2Ces%7Cdevice%3Amobile%7Cplan%3Apro%2Cteam'

// --- Tokens ------------------------------------------------------------
//
// A token is one part of the URL plus where it lives in the string.
//
// role      what kind of part it is (drives colour and what you can do to it)
// start,end character range in the canonical URL text
// raw       the characters as they appear in the URL
// text      the decoded characters, for display and for editing
// index     position among siblings (segment index, entry index)
// editable  whether typing over it is a defined operation
// group     'origin' | 'path' | 'query' | 'hash'

const ROLE_LABEL = {
  scheme: 'scheme',
  userinfo: 'user info',
  host: 'host',
  port: 'port',
  sep: 'separator',
  seg: 'path segment',
  qmark: 'separator',
  key: 'param name',
  eq: 'separator',
  val: 'param value',
  amp: 'separator',
  hash: 'fragment',
};

const PUNCT = new Set(['sep', 'qmark', 'eq', 'amp', 'scheme']);

function isPunct(role) {
  return PUNCT.has(role);
}

/**
 * Parse a URL into a model plus offset-mapped tokens.
 *
 * The text the tokens index into is buildUrl(model), not the input string:
 * the model drops a few meaningless things (an empty `&&` chunk), so building
 * from it is the only way offsets are guaranteed to line up with what the user
 * sees. For every URL that survives a round trip - which is every URL the
 * model's tests cover - the two are byte for byte identical.
 *
 * @returns {{ok: boolean, text?: string, model?: object, tokens?: object[], error?: string}}
 */
function tokenize(url) {
  const model = parseUrl(url);
  if (!model) return { ok: false, error: 'Not a URL.' };

  let u;
  try {
    u = new URL(url);
  } catch {
    return { ok: false, error: 'Not a URL.' };
  }

  const tokens = [];
  let pos = 0;

  const push = (role, raw, extra = {}) => {
    const token = {
      role,
      raw,
      text: extra.text !== undefined ? extra.text : raw,
      start: pos,
      end: pos + raw.length,
      group: extra.group || 'origin',
      index: extra.index,
      editable: !isPunct(role),
      id: `${role}-${extra.index ?? tokens.length}`,
      ...extra,
    };
    tokens.push(token);
    pos = token.end;
    return token;
  };

  // Origin. Rebuilt part by part so the pieces add up to model.prefix; if the
  // arithmetic ever disagrees the whole origin is emitted as one opaque token
  // rather than producing offsets that lie.
  const origin = [
    ['scheme', u.protocol + '//'],
    u.username ? ['userinfo', u.username + (u.password ? ':' + u.password : '') + '@'] : null,
    ['host', u.hostname],
    u.port ? ['port', ':' + u.port] : null,
  ].filter(Boolean);

  if (origin.map(([, raw]) => raw).join('') === model.prefix) {
    for (const [role, raw] of origin) push(role, raw, { group: 'origin' });
  } else {
    push('host', model.prefix, { group: 'origin' });
  }

  // Path
  if (model.segments.length === 0) {
    push('sep', '/', { group: 'path' });
  } else {
    model.segments.forEach((seg, index) => {
      push('sep', '/', { group: 'path' });
      push('seg', seg.raw, { text: seg.text, index, group: 'path', id: `seg-${index}` });
    });
    if (model.trailingSlash) push('sep', '/', { group: 'path' });
  }

  // Query
  if (model.entries.length > 0) {
    push('qmark', '?', { group: 'query' });
    model.entries.forEach((entry, index) => {
      if (index > 0) push('amp', '&', { group: 'query' });
      push('key', entry.rawKey, { text: entry.key, index, group: 'query', id: `key-${index}` });
      if (entry.rawValue !== null) {
        push('eq', '=', { group: 'query' });
        push('val', entry.rawValue, { text: entry.value, index, group: 'query', id: `val-${index}` });
      }
    });
  }

  if (model.hash) push('hash', model.hash, { text: safeDecode(model.hash.slice(1)), group: 'hash' });

  return { ok: true, text: buildUrl(model), model, tokens };
}

/** The token containing a character offset (ties go to the token that starts there). */
function tokenAt(tokens, offset) {
  return tokens.find(t => offset >= t.start && offset < t.end)
    || tokens.find(t => offset === t.end)
    || null;
}

/**
 * Every token the range [from,to) touches. A caret (a zero-width range)
 * touches one - and when that one is punctuation but a real part ends exactly
 * there, the part wins: after typing at the end of a value the caret sits on
 * the `&`, and the user is still working on the value.
 */
function tokensIn(tokens, from, to) {
  if (from === to) {
    const here = tokenAt(tokens, from);
    if (here && isPunct(here.role)) {
      const before = tokens.find(t => t.end === from && !isPunct(t.role));
      if (before) return [before];
    }
    return here ? [here] : [];
  }
  return tokens.filter(t => t.start < to && t.end > from);
}

/** The character range covering a whole group, e.g. the entire query. */
function groupRange(tokens, group) {
  const inGroup = tokens.filter(t => t.group === group);
  if (inGroup.length === 0) return null;
  return { start: inGroup[0].start, end: inGroup[inGroup.length - 1].end };
}

/**
 * The encoder that belongs to a role: typing `a b` into a path segment has to
 * produce `a%20b`, and into a param value `a%20b` too, but the two roles keep
 * different characters legible (see url-model.js).
 */
function encodeFor(role, text) {
  if (role === 'seg') return encodeSegment(text);
  if (role === 'key' || role === 'val') return encodeQueryPart(text);
  if (role === 'hash') return '#' + encodeURI(text).replace(/#/g, '%23');
  return text;
}

/** Splice new RAW text into the URL at a character range. */
function spliceRaw(text, start, end, raw) {
  return text.slice(0, start) + raw + text.slice(end);
}

/** Type over one token: encodes for its role, then splices. */
function retype(text, token, newText) {
  return spliceRaw(text, token.start, token.end, encodeFor(token.role, newText));
}

// --- Value inspection --------------------------------------------------
//
// What a value really is, peeled one layer at a time. This is what makes an
// encoded value or a nested URL touchable instead of a wall of %3A%2F%2F.

const B64 = /^[A-Za-z0-9+/_-]{12,}={0,2}$/;

function tryBase64(s) {
  if (!B64.test(s)) return null;
  try {
    const decoded = atob(s.replace(/-/g, '+').replace(/_/g, '/'));
    // Only call it base64 if what comes out is plausible text.
    if (!/^[\x09\x0a\x0d\x20-\x7e]+$/.test(decoded)) return null;
    if (decoded.length < 4) return null;
    return decoded;
  } catch {
    return null;
  }
}

function tryJson(s) {
  const t = s.trim();
  if (!/^[[{]/.test(t)) return null;
  try {
    return JSON.stringify(JSON.parse(t), null, 2);
  } catch {
    return null;
  }
}

/**
 * Peel a raw value into layers. Each layer is what you get after one more
 * decoding step, and the last one is the most human form of the value.
 *
 * @returns {{kind: string, label: string, text: string, isUrl: boolean}[]}
 */
function peel(raw) {
  const layers = [{ kind: 'raw', label: 'as written', text: raw, isUrl: false }];
  let current = raw;

  const decoded = decodeQueryPart(current);
  if (decoded !== current) {
    current = decoded;
    layers.push({ kind: 'percent', label: 'percent-decoded', text: current, isUrl: false });
  }

  if (/^https?:\/\/\S+$/i.test(current.trim())) {
    layers[layers.length - 1].isUrl = true;
    return layers;
  }

  const jwtParts = current.split('.');
  if (jwtParts.length === 3 && jwtParts.every(p => tryBase64(p) || p.length > 8)) {
    const head = tryBase64(jwtParts[0]);
    const body = tryBase64(jwtParts[1]);
    if (head && body) {
      const pretty = [head, body].map(p => tryJson(p) || p).join('\n---\n');
      layers.push({ kind: 'jwt', label: 'JWT header + payload', text: pretty, isUrl: false });
      return layers;
    }
  }

  const b64 = tryBase64(current);
  if (b64) {
    current = b64;
    layers.push({ kind: 'base64', label: 'base64-decoded', text: current, isUrl: false });
  }

  const json = tryJson(current);
  if (json) layers.push({ kind: 'json', label: 'JSON', text: json, isUrl: false });

  return layers;
}

/** A one-word badge for a value that is hiding something. */
function badgeFor(raw) {
  const layers = peel(raw);
  if (layers.length === 1) return null;
  const last = layers[layers.length - 1];
  if (last.isUrl) return 'url';
  return { percent: 'encoded', base64: 'base64', json: 'json', jwt: 'jwt' }[last.kind] || null;
}

// --- Staged diff -------------------------------------------------------

/** Which tokens differ from the URL the tab is on, by id. */
function changedIds(baseTokens, workTokens) {
  const base = new Map(baseTokens.filter(t => t.editable).map(t => [t.id, t.raw]));
  const changed = new Set();
  for (const t of workTokens) {
    if (!t.editable) continue;
    if (!base.has(t.id) || base.get(t.id) !== t.raw) changed.add(t.id);
  }
  return changed;
}

/**
 * How many parts the user has touched.
 *
 * Counting by token id is wrong the moment something is deleted: every later
 * part shifts its index, so `key-3` now holds what `key-4` used to and the
 * whole tail reads as edited. So this compares the two token lists as
 * multisets of (role, raw) instead: one edit is one part gone and one part
 * arrived, a delete is one gone, an add is one arrived.
 */
function countChanges(baseText, workText, baseTokens, workTokens) {
  if (baseText === workText) return 0;

  // A parameter counts as ONE thing, so deleting `tags=sale,new` is one
  // change rather than two (its name and its value).
  const bag = tokens => {
    const m = new Map();
    const params = new Map();
    for (const t of tokens) {
      if (!t.editable) continue;
      if (t.role === 'key' || t.role === 'val') {
        const cur = params.get(t.index) || { key: '', val: null };
        if (t.role === 'key') cur.key = t.raw; else cur.val = t.raw;
        params.set(t.index, cur);
        continue;
      }
      const k = `${t.role}\u0000${t.raw}`;
      m.set(k, (m.get(k) || 0) + 1);
    }
    for (const p of params.values()) {
      const k = `param\u0000${p.key}\u0000${p.val}`;
      m.set(k, (m.get(k) || 0) + 1);
    }
    return m;
  };
  const a = bag(baseTokens);
  const b = bag(workTokens);

  let gone = 0;
  let arrived = 0;
  for (const [k, n] of a) gone += Math.max(0, n - (b.get(k) || 0));
  for (const [k, n] of b) arrived += Math.max(0, n - (a.get(k) || 0));

  return Math.max(1, gone, arrived);
}

// ---- page ----


const $ = id => document.getElementById(id);

const GROUPS = ['origin', 'path', 'query', 'hash'];
const META = {
  origin: { glyph: '⌂', name: 'host', color: 'var(--mauve)', unit: 'part' },
  path:   { glyph: '/', name: 'path', color: 'var(--peach)', unit: 'segment' },
  query:  { glyph: '?', name: 'query', color: 'var(--blue)', unit: 'param' },
  hash:   { glyph: '#', name: 'fragment', color: 'var(--teal)', unit: 'fragment' },
};

// --- state -------------------------------------------------------------

let baseText = '';
let baseTok = null;
let text = '';
let tok = null;
let open = null;              // the section whose dropdown is showing
let selection = new Set();    // row keys inside the open section
let anchor = null;            // row key, for shift-range
let expanded = new Set();     // row keys showing their peeled layers
let adding = false;           // a phantom "new part" row is live in the open section
let focusAfter = null;        // { cell } | { row } - where focus goes after the next render

function load(url) {
  const r = tokenize(url);
  baseTok = tok = r;
  baseText = text = r.text;
  selection = new Set(); anchor = null; expanded = new Set(); adding = false;
  open = tok.model.entries.length ? 'query' : 'path';
}

// --- rows: what a section is made of ----------------------------------
//
// A row is one thing the user can select, copy, type over or delete. In
// the query it is a whole parameter (name and value together) - which is
// what the change counter counts too.

function rowsOf(group) {
  const T = tok.tokens;
  const one = role => T.find(t => t.role === role);
  if (group === 'origin') {
    const out = [];
    const ui = one('userinfo');
    if (ui) out.push({ key: 'userinfo', role: 'userinfo', main: ui, text: ui.raw.slice(0, -1), raw: ui.raw.slice(0, -1), label: 'user info' });
    const h = one('host');
    out.push({ key: 'host', role: 'host', main: h, text: h.text, raw: h.raw, label: 'host' });
    const p = one('port');
    if (p) out.push({ key: 'port', role: 'port', main: p, text: p.raw.slice(1), raw: p.raw.slice(1), label: 'port' });
    return out;
  }
  if (group === 'path') {
    return T.filter(t => t.role === 'seg').map(t => ({
      key: `seg-${t.index}`, role: 'seg', main: t, text: t.text, raw: t.raw, label: `segment ${t.index + 1}`,
    }));
  }
  if (group === 'query') {
    const out = [];
    for (const k of T.filter(t => t.role === 'key')) {
      const v = T.find(t => t.role === 'val' && t.index === k.index) || null;
      out.push({
        key: `param-${k.index}`, role: 'param', k, v, main: v || k,
        text: v ? `${k.text}=${v.text}` : k.text,
        raw: v ? `${k.raw}=${v.raw}` : k.raw,
        label: `parameter ${k.index + 1}`,
      });
    }
    return out;
  }
  const h = one('hash');
  return h ? [{ key: 'hash', role: 'hash', main: h, text: h.text, raw: h.raw.slice(1), label: 'fragment' }] : [];
}

const rowByKey = key => rowsOf(open).find(r => r.key === key) || null;

/** A row's raw text as the URL has it, for the multiset diff against the base. */
function rowSig(row) {
  return `${row.role}\u0000${row.raw}`;
}

/**
 * Which rows differ from the tab's URL. A delete shifts every later index,
 * so this compares rows as a multiset of (role, raw) rather than by index:
 * a row is changed when the base has no unconsumed row that reads the same.
 */
function changedKeys(group) {
  const saved = tok;
  tok = baseTok;
  const bag = new Map();
  for (const r of rowsOf(group)) bag.set(rowSig(r), (bag.get(rowSig(r)) || 0) + 1);
  tok = saved;
  const out = new Set();
  for (const r of rowsOf(group)) {
    const n = bag.get(rowSig(r)) || 0;
    if (n > 0) bag.set(rowSig(r), n - 1); else out.add(r.key);
  }
  return out;
}

function sectionRaw(t, group) {
  const g = groupRange(t.tokens, group);
  return g ? t.text.slice(g.start, g.end) : '';
}

// --- render ------------------------------------------------------------

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function cellSummary(group) {
  const T = tok.tokens;
  if (group === 'origin') {
    return T.filter(t => t.group === 'origin' && t.role !== 'scheme')
      .map(t => `<span class="r-${t.role} t">${esc(t.raw)}</span>`).join('');
  }
  if (group === 'path') {
    const segs = T.filter(t => t.role === 'seg');
    if (!segs.length) return '<span class="dim">root</span>';
    return segs.map(t => `<span class="r-seg">${esc(t.text)}</span>`).join('<span class="r-sep">/</span>');
  }
  if (group === 'query') {
    const n = tok.model.entries.length;
    return n ? `<span class="r-key">${n} param${n === 1 ? '' : 's'}</span>` : '<span class="dim">none</span>';
  }
  const h = T.find(t => t.role === 'hash');
  return h ? `<span class="r-hash">${esc(h.text)}</span>` : '<span class="dim">none</span>';
}

function railEdges() {
  const r = $('rail');
  $('rail-wrap').classList.toggle('more-left', r.scrollLeft > 2);
  $('rail-wrap').classList.toggle('more-right', r.scrollLeft + r.clientWidth < r.scrollWidth - 2);
}

function renderRail() {
  $('rail').innerHTML = GROUPS.map(g => {
    const changed = sectionRaw(baseTok, g) !== sectionRaw(tok, g);
    return `<button class="cell${open === g ? ' open' : ''}${changed ? ' changed' : ''}"
      data-group="${g}" role="tab" aria-selected="${open === g}" style="--sec:${META[g].color}"
      title="${META[g].name}${changed ? ' - changed, unapplied' : ''}">
      <span class="glyph">${META[g].glyph}</span>
      <span class="sum">${cellSummary(g)}</span>
      <span class="caret">▾</span>
    </button>`;
  }).join('');
  const cur = $('rail').querySelector('.cell.open');
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  railEdges();
}

function rowHtml(row, i, changed) {
  const editable = row.role === 'param' ? (row.v ? row.v.raw : null)
    : row.role === 'seg' || row.role === 'hash' ? row.raw : null;
  const badge = editable === null ? null : badgeFor(editable);
  const sel = selection.has(row.key);
  const isOpen = expanded.has(row.key);
  let body;
  if (row.role === 'param') {
    body = `<span class="r-key t" data-field="key">${esc(row.k.text)}</span>`
      + (row.v ? `<span class="r-eq">=</span><span class="r-val t" data-field="val">${esc(row.v.text)}</span>`
        : '<span class="bare">no value</span>');
  } else {
    body = `<span class="r-${row.role} t" data-field="text">${esc(row.text)}</span>`;
  }
  const layers = isOpen && editable !== null ? peel(editable) : [];
  return `<div class="row${sel ? ' sel' : ''}${changed ? ' changed' : ''}${isOpen ? ' expanded' : ''}"
      data-key="${row.key}" tabindex="${i === 0 ? 0 : -1}" role="option" aria-selected="${sel}"
      aria-label="${esc(row.label)}: ${esc(row.text)}">
    <div class="row-line">
      <span class="idx">${row.role === 'seg' || row.role === 'param' ? i + 1 : META[open].glyph}</span>
      <span class="body">${body}</span>
      ${badge ? `<button class="badge ${badge}" data-act="peel" title="${isOpen ? 'Hide' : 'Show'} what this really says">${badge === 'encoded' ? '%' : badge}</button>` : ''}
      <span class="acts">
        <button class="ico" data-act="copy" title="Copy as written in the URL">⧉</button>
        <button class="ico" data-act="edit" title="Type over (Enter)">✎</button>
        <button class="ico del" data-act="del" title="Delete (⌫)"${row.role === 'host' ? ' disabled' : ''}>×</button>
      </span>
    </div>
    ${layers.length ? `<div class="layers">${layers.map((l, li) => `
      <div class="layer${li === layers.length - 1 ? ' last' : ''}">
        <div class="layer-head"><span class="layer-label">${l.label}${l.isUrl ? ' · nested url' : ''}</span>
          <button class="ico" data-act="copy-layer" data-layer="${li}" title="Copy this form">⧉</button></div>
        <pre>${esc(l.text)}</pre>
      </div>`).join('')}</div>` : ''}
  </div>`;
}

function phantomHtml() {
  const g = open;
  const inputs = g === 'query'
    ? '<input class="k" data-new="key" placeholder="name" aria-label="New parameter name" spellcheck="false">'
      + '<span class="r-eq">=</span><input data-new="val" placeholder="value" aria-label="New parameter value" spellcheck="false">'
    : `<input data-new="text" placeholder="${g === 'origin' ? 'port' : g === 'path' ? 'segment' : 'fragment'}"
        aria-label="New ${META[g].unit}" spellcheck="false"${g === 'origin' ? ' inputmode="numeric"' : ''}>`;
  return `<div class="row phantom editing" data-phantom="1">
    <div class="row-line"><span class="idx">+</span><span class="body">${inputs}</span>
    <span class="acts"><button class="ico" data-act="add-ok" title="Add (Enter)">↵</button>
    <button class="ico del" data-act="add-cancel" title="Cancel (Esc)">×</button></span></div></div>`;
}

function renderPanel() {
  const panel = $('panel');
  const head = $('p-head');
  const list = $('p-list');
  panel.classList.toggle('none', !open);
  if (!open) {
    panel.style.setProperty('--sec', 'var(--muted)');
    head.innerHTML = '<span class="p-title">Pick a section on the rail</span>';
    list.innerHTML = '<div class="hint">Every part of the URL is on the rail above.<br>'
      + 'Click one - or press <b>↓</b> - to see what is in it.</div>';
    return;
  }
  panel.style.setProperty('--sec', META[open].color);
  const rows = rowsOf(open);
  const changed = changedKeys(open);
  const nSel = [...selection].filter(k => rows.some(r => r.key === k)).length;
  const allSel = rows.length > 0 && nSel === rows.length;
  const canAdd = open === 'path' || open === 'query'
    || (open === 'hash' && rows.length === 0)
    || (open === 'origin' && !rows.some(r => r.key === 'port'));
  const canClear = open !== 'origin' && rows.length > 0;

  head.innerHTML = `<span class="p-title">${nSel
    ? `<b>${nSel} selected</b> of ${rows.length}`
    : `<b>${META[open].name}</b> · <span class="n">${rows.length}</span> ${META[open].unit}${rows.length === 1 ? '' : 's'}`}</span>
    <button class="btn" data-hact="copy" title="${nSel ? 'Copy the selected parts' : 'Copy the whole section as it appears in the URL'}"${rows.length ? '' : ' disabled'}>Copy</button>
    <button class="btn" data-hact="${allSel ? 'none' : 'all'}" title="${allSel ? 'Select none' : 'Select all'}"${rows.length ? '' : ' disabled'}>${allSel ? 'None' : 'All'}</button>
    <button class="btn" data-hact="add" title="${open === 'origin' ? 'Add a port' : 'Add a ' + META[open].unit}"${canAdd ? '' : ' disabled'}>+ Add</button>
    <button class="btn btn-danger" data-hact="${nSel ? 'del' : 'clear'}" title="${nSel ? 'Delete the selected parts' : 'Remove the whole section'}"${(nSel || canClear) ? '' : ' disabled'}>${nSel ? `Delete ${nSel}` : 'Clear'}</button>`;

  let html = rows.map((r, i) => rowHtml(r, i, changed.has(r.key))).join('');
  if (adding) html += phantomHtml();
  if (!rows.length && !adding) {
    html = `<div class="hint">${open === 'path' ? 'Root path - no segments.'
      : open === 'query' ? 'No query string.' : 'No fragment.'}<br><b>+ Add</b> puts one in.</div>`;
  }
  list.innerHTML = html;
}

function renderRaw() {
  $('raw-url').innerHTML = tok.tokens.map(t => `<span class="r-${t.role}">${esc(t.raw)}</span>`).join('');
  $('raw').classList.toggle('dirty', text !== baseText);
}

function renderChrome() {
  const dirty = text !== baseText;
  const n = dirty ? countChanges(baseText, text, baseTok.tokens, tok.tokens) : 0;
  $('change-summary').textContent = dirty
    ? `${n} unapplied change${n === 1 ? '' : 's'}` : 'No unapplied changes';
  $('status-bar').classList.toggle('dirty', dirty);
  for (const id of ['apply-btn', 'new-btn', 'revert-btn']) $(id).disabled = !dirty;
}

function render() {
  renderRail();
  renderPanel();
  renderRaw();
  renderChrome();
  if (focusAfter) {
    const want = focusAfter; focusAfter = null;
    if (want.cell) focusCell(want.cell);
    else if (want.row) focusRow(want.row);
    else if (want.phantom) {
      const inp = $('p-list').querySelector('[data-phantom] input');
      if (inp) inp.focus();
    }
  }
}

function focusCell(group) {
  const el = $('rail').querySelector(`.cell[data-group="${group}"]`);
  if (!el) return;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}

function focusRow(key) {
  const rows = [...$('p-list').querySelectorAll('.row[data-key]')];
  const el = rows.find(r => r.dataset.key === key) || rows[0];
  if (!el) return;
  for (const r of rows) r.tabIndex = r === el ? 0 : -1;
  el.focus({ preventScroll: true });
  el.scrollIntoView({ block: 'nearest' });
}

// --- edits: every one is a splice into the URL string -----------------

/** `focus` may be a function, so it can pick a row that only exists after the edit. */
function commit(next, focus) {
  const r = tokenize(next);
  if (!r.ok) { flash(r.error, true); return false; }
  tok = r;
  text = r.text;
  if (focus) focusAfter = typeof focus === 'function' ? focus() : focus;
  render();
  return true;
}

/** Deleting a part takes its punctuation with it, so the URL stays a URL. */
function rangeToDelete(row) {
  const T = tok.tokens;
  if (row.role === 'seg') {
    const i = T.indexOf(row.main);
    const from = T[i - 1] && T[i - 1].role === 'sep' ? T[i - 1].start : row.main.start;
    return [from, row.main.end];
  }
  if (row.role === 'param') {
    const first = row.k, last = row.v || row.k;
    let from = first.start, to = last.end;
    const before = T[T.indexOf(first) - 1];
    const after = T[T.indexOf(last) + 1];
    if (before && before.role === 'amp') from = before.start;
    else if (after && after.role === 'amp') to = after.end;
    else if (before && before.role === 'qmark') from = before.start;
    return [from, to];
  }
  if (row.role === 'host') return null;
  return [row.main.start, row.main.end];
}

function deleteRows(rows) {
  const ranges = rows.map(rangeToDelete).filter(Boolean).sort((a, b) => a[0] - b[0]);
  if (!ranges.length) { flash('A URL needs its host.', true); return; }
  const merged = [];
  for (const r of ranges) {
    const last = merged.at(-1);
    if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else merged.push([...r]);
  }
  let next = text;
  for (const [from, to] of [...merged].reverse()) next = spliceRaw(next, from, to, '');
  selection = new Set(); anchor = null;
  const n = rows.length;
  // Focus lands on the row that slid into the gap, so delete-delete-delete flows.
  const at = rowsOf(open).findIndex(r => r.key === rows[0].key);
  const landing = () => {
    const left = rowsOf(open);
    return left.length ? { row: left[Math.min(Math.max(at, 0), left.length - 1)].key } : { cell: open };
  };
  if (commit(next, landing)) flash(`Deleted ${n} ${META[open].unit}${n === 1 ? '' : 's'}.`);
}

function clearSection() {
  const g = groupRange(tok.tokens, open);
  if (!g) return;
  const next = spliceRaw(text, g.start, g.end, open === 'path' ? '/' : '');
  selection = new Set(); anchor = null;
  if (commit(next, { cell: open })) flash(`Cleared the ${META[open].name}.`);
}

/** Type over one field of a row: `{ ok, text }` or `{ ok: false, error }`. */
function retyped(row, field, value) {
  const ok = t => ({ ok: true, text: t });
  const err = error => ({ ok: false, error });
  const splice = (t, raw) => ok(spliceRaw(text, t.start, t.end, raw));
  if (field === 'key') {
    return value === '' ? err('Key cannot be empty.') : splice(row.k, encodeFor('key', value));
  }
  if (field === 'val') return splice(row.v, encodeFor('val', value));
  const t = row.main;
  switch (row.role) {
    case 'seg':
      return value === '' ? err('Segment cannot be empty.') : splice(t, encodeFor('seg', value));
    case 'port':
      if (value === '') return splice(t, '');
      return /^\d{1,5}$/.test(value) ? splice(t, ':' + value) : err('A port is a number.');
    case 'hash':
      return splice(t, value === '' ? '' : encodeFor('hash', value));
    case 'host':
      return value === '' ? err('A URL needs its host.') : splice(t, value);
    case 'userinfo':
      return splice(t, value === '' ? '' : value + '@');
    default:
      return ok(text);
  }
}

function startEdit(key, field) {
  const row = rowByKey(key);
  if (!row) return;
  const el = $('p-list').querySelector(`.row[data-key="${key}"]`);
  if (!el || el.querySelector('input')) return;
  if (row.role === 'param' && field !== 'key' && !row.v) field = 'key';
  const target = el.querySelector(`[data-field="${field}"]`);
  if (!target) return;

  const current = field === 'key' ? row.k.text : field === 'val' ? row.v.text : row.text;
  const input = document.createElement('input');
  input.value = current;
  input.spellcheck = false;
  input.setAttribute('aria-label', `Type over ${row.label}`);
  if (field === 'key') input.className = 'k';
  target.replaceWith(input);
  el.classList.add('editing');
  input.focus();
  input.select();                     // type-over: the whole piece is armed

  // Enter commits and re-renders, which removes the input and fires blur; the
  // guard keeps that second call from re-running the edit.
  let done = false;
  const finish = ok => {
    if (done) return;
    done = true;
    focusAfter = { row: key };
    if (!ok || input.value === current) { render(); return; }
    const live = rowByKey(key);
    if (!live) { render(); return; }
    const r = retyped(live, field, input.value);
    if (!r.ok) { flash(r.error, true); render(); return; }
    if (r.text === text || !commit(r.text)) render();
  };
  input.addEventListener('blur', () => finish(true));
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); finish(true); }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    else if (e.key === 'Tab' && row.role === 'param' && field === 'key' && row.v) {
      e.preventDefault(); finish(true);
      startEdit(key, 'val');
    }
  });
}

// --- adding: a phantom row that only touches the URL when it commits ---

function startAdd() {
  adding = true;
  selection = new Set();
  focusAfter = { phantom: true };
  render();
}

function commitAdd() {
  const box = $('p-list').querySelector('[data-phantom]');
  if (!box) return;
  const val = name => { const i = box.querySelector(`[data-new="${name}"]`); return i ? i.value : ''; };
  let next = text;
  let focus = null;
  if (open === 'path') {
    const v = val('text');
    if (v === '') { cancelAdd(); return; }
    const g = groupRange(tok.tokens, 'path');
    const piece = encodeFor('seg', v);
    const n = tok.model.segments.length;
    next = spliceRaw(text, g.end, g.end, (n === 0 || tok.model.trailingSlash) ? piece : '/' + piece);
    focus = { row: `seg-${n}` };
  } else if (open === 'query') {
    const k = val('key'), v = val('val');
    if (k === '') { if (v === '') { cancelAdd(); return; } flash('Key cannot be empty.', true); return; }
    const piece = encodeFor('key', k) + (v === '' ? '' : '=' + encodeFor('val', v));
    const q = groupRange(tok.tokens, 'query');
    const n = tok.model.entries.length;
    next = q ? spliceRaw(text, q.end, q.end, '&' + piece)
      : spliceRaw(text, groupRange(tok.tokens, 'path').end, groupRange(tok.tokens, 'path').end, '?' + piece);
    focus = { row: `param-${n}` };
  } else if (open === 'hash') {
    const v = val('text');
    if (v === '') { cancelAdd(); return; }
    next = text + encodeFor('hash', v);
    focus = { row: 'hash' };
  } else {
    const v = val('text');
    if (v === '') { cancelAdd(); return; }
    if (!/^\d{1,5}$/.test(v)) { flash('A port is a number.', true); return; }
    const h = tok.tokens.find(t => t.role === 'host');
    next = spliceRaw(text, h.end, h.end, ':' + v);
    focus = { row: 'port' };
  }
  adding = false;
  if (!commit(next, focus)) { adding = true; render(); }
}

function cancelAdd() {
  adding = false;
  focusAfter = { cell: open };
  render();
}

// --- selection ---------------------------------------------------------

function pick(key, e) {
  const keys = rowsOf(open).map(r => r.key);
  if (e && (e.metaKey || e.ctrlKey)) {
    selection.has(key) ? selection.delete(key) : selection.add(key);
    anchor = key;
  } else if (e && e.shiftKey && anchor && keys.includes(anchor)) {
    const a = keys.indexOf(anchor), b = keys.indexOf(key);
    selection = new Set(keys.slice(Math.min(a, b), Math.max(a, b) + 1));
  } else {
    selection = new Set([key]);
    anchor = key;
  }
  focusAfter = { row: key };
  render();
}

function selectedRows() {
  return rowsOf(open).filter(r => selection.has(r.key));
}

// --- copy --------------------------------------------------------------

function copyRows(rows) {
  if (!rows.length) return;
  const joiner = open === 'path' ? '/' : open === 'query' ? '&' : '\n';
  copy(rows.map(r => r.raw).join(joiner));
}

function copySection() {
  const s = sectionRaw(tok, open);
  if (s) copy(s); else flash(`This URL has no ${META[open].name}.`, true);
}

// --- opening a section -------------------------------------------------

function openSection(group, focus) {
  if (open !== group) { selection = new Set(); anchor = null; adding = false; }
  open = group;
  focusAfter = focus || { cell: group };
  render();
}

function closePanel() {
  const was = open;
  open = null; selection = new Set(); anchor = null; adding = false;
  focusAfter = { cell: was || 'origin' };
  render();
}

// --- events: rail ------------------------------------------------------

$('rail').addEventListener('scroll', railEdges);

$('rail').addEventListener('click', e => {
  const cell = e.target.closest('.cell');
  if (!cell) return;
  const g = cell.dataset.group;
  if (open === g) closePanel(); else openSection(g);
});

// --- events: panel -----------------------------------------------------

$('p-head').addEventListener('click', e => {
  const btn = e.target.closest('button[data-hact]');
  if (!btn || btn.disabled) return;
  const act = btn.dataset.hact;
  const sel = selectedRows();
  if (act === 'copy') sel.length ? copyRows(sel) : copySection();
  else if (act === 'all') { selection = new Set(rowsOf(open).map(r => r.key)); render(); }
  else if (act === 'none') { selection = new Set(); render(); }
  else if (act === 'add') startAdd();
  else if (act === 'del') deleteRows(sel);
  else if (act === 'clear') clearSection();
});

$('p-list').addEventListener('click', e => {
  const act = e.target.closest('button[data-act]');
  const phantom = e.target.closest('[data-phantom]');
  if (phantom) {
    if (act && act.dataset.act === 'add-ok') commitAdd();
    else if (act && act.dataset.act === 'add-cancel') cancelAdd();
    return;
  }
  const el = e.target.closest('.row[data-key]');
  if (!el) return;
  const key = el.dataset.key;
  if (act) {
    const row = rowByKey(key);
    const a = act.dataset.act;
    if (a === 'copy') copyRows([row]);
    else if (a === 'edit') startEdit(key, row.role === 'param' ? 'val' : 'text');
    else if (a === 'del') deleteRows([row]);
    else if (a === 'peel') { expanded.has(key) ? expanded.delete(key) : expanded.add(key); focusAfter = { row: key }; render(); }
    else if (a === 'copy-layer') {
      const editable = row.role === 'param' ? row.v.raw : row.raw;
      copy(peel(editable)[+act.dataset.layer].text);
    }
    return;
  }
  if (e.target.tagName === 'INPUT' || e.target.closest('.layers')) return;
  pick(key, e);
});

$('p-list').addEventListener('dblclick', e => {
  const el = e.target.closest('.row[data-key]');
  if (!el || e.target.tagName === 'INPUT' || e.target.closest('.layers')) return;
  const field = e.target.closest('[data-field]');
  const row = rowByKey(el.dataset.key);
  startEdit(el.dataset.key, field ? field.dataset.field : row.role === 'param' ? 'val' : 'text');
});

$('p-list').addEventListener('keydown', e => {
  const inp = e.target.closest('[data-phantom] input');
  if (!inp) return;
  e.stopPropagation();
  if (e.key === 'Enter') { e.preventDefault(); commitAdd(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelAdd(); }
  else if (e.key === 'Tab' && inp.dataset.new === 'key' && !e.shiftKey) {
    e.preventDefault();
    const v = $('p-list').querySelector('[data-new="val"]');
    if (v) v.focus();
  }
});

// --- events: keyboard --------------------------------------------------

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key === 'Enter') { e.preventDefault(); apply(); return; }

  const cell = e.target.closest ? e.target.closest('.cell') : null;
  const rowEl = e.target.closest ? e.target.closest('.row[data-key]') : null;
  const at = GROUPS.indexOf(open);

  const step = dir => {
    const from = cell ? GROUPS.indexOf(cell.dataset.group) : at;
    const g = GROUPS[Math.max(0, Math.min(GROUPS.length - 1, (from === -1 ? 0 : from) + dir))];
    if (open) openSection(g); else { focusAfter = { cell: g }; render(); }
  };

  if (cell) {
    const g = cell.dataset.group;
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const first = rowsOf(g)[0];
      openSection(g, first ? { row: first.key } : { cell: g });
    } else if (e.key === 'Escape') { e.preventDefault(); if (open) closePanel(); }
    return;
  }

  if (rowEl) {
    const rows = [...$('p-list').querySelectorAll('.row[data-key]')];
    const i = rows.indexOf(rowEl);
    const key = rowEl.dataset.key;
    const move = to => {
      const next = rows[to];
      if (!next) { if (to < 0) focusCell(open); return; }
      if (e.shiftKey) pick(next.dataset.key, { shiftKey: true });
      else focusRow(next.dataset.key);
    };
    if (e.key === 'ArrowDown') { e.preventDefault(); move(i + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(i - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') { e.preventDefault(); move(0); }
    else if (e.key === 'End') { e.preventDefault(); move(rows.length - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const row = rowByKey(key);
      startEdit(key, row.role === 'param' ? 'val' : 'text');
    } else if (e.key === ' ') { e.preventDefault(); pick(key, { metaKey: true }); }
    else if (e.key === 'Backspace' || e.key === 'Delete') {
      e.preventDefault();
      const sel = selectedRows();
      deleteRows(sel.length ? sel : [rowByKey(key)]);
    } else if (mod && e.key === 'c') {
      e.preventDefault();
      const sel = selectedRows();
      copyRows(sel.length ? sel : [rowByKey(key)]);
    } else if (mod && e.key === 'a') {
      e.preventDefault();
      selection = new Set(rowsOf(open).map(r => r.key));
      focusAfter = { row: key }; render();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (selection.size) { selection = new Set(); focusAfter = { row: key }; render(); }
      else closePanel();
    } else if (e.key === 'Tab' && !e.shiftKey && i < rows.length - 1) {
      // Tab walks the rows too, so a keyboard user is never trapped on one.
      e.preventDefault(); focusRow(rows[i + 1].dataset.key);
    }
    return;
  }

  if (e.key === 'Escape' && open) { closePanel(); }
});

// --- chrome ------------------------------------------------------------

function copy(s) {
  navigator.clipboard.writeText(s).then(
    () => flash('Copied: ' + (s.length > 38 ? s.slice(0, 38) + '…' : s)),
    () => flash('Clipboard blocked in this frame.', true));
}

let toastTimer = null;
function flash(msg, bad) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!bad);
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
}

function apply() {
  if (text === baseText) return;
  baseText = text; baseTok = tok;
  render();
  flash('Applied - the tab would navigate here.');
}

$('copy-url').onclick = () => copy(text);
$('apply-btn').onclick = apply;
$('new-btn').onclick = () => flash('Would open a new tab at the edited URL.');
$('revert-btn').onclick = () => {
  text = baseText; tok = baseTok;
  selection = new Set(); anchor = null; adding = false;
  render();
};

for (const btn of document.querySelectorAll('[data-sample]')) {
  btn.onclick = () => {
    for (const b of document.querySelectorAll('[data-sample]')) b.setAttribute('aria-pressed', 'false');
    btn.setAttribute('aria-pressed', 'true');
    load(SAMPLES[btn.dataset.sample]);
    render();
  };
}

load(SAMPLES.typical);
render();

</script>
</body>
</html>
